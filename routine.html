</div></main></div>
<div class="toast-container"></div><script src="js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{
 if(document.body.dataset.page!=='routine')return; CC.requireAuth();
 const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 const classes={
  Sunday:[['Software Requirements Engineering','SWE 212','Dr. Rahman','401','09:30 AM','11:00 AM'],['Database Management Systems','CSE 221','Ms. Jahan','305','01:00 PM','02:30 PM']],
  Monday:[['Computer Networks','CSE 231','Mr. Hasan','302','10:00 AM','11:30 AM'],['Web Engineering','SWE 315','Ms. Sultana','407','02:00 PM','03:30 PM']],
  Tuesday:[['Software Testing','SWE 321','Dr. Karim','403','09:00 AM','10:30 AM'],['Database Lab','CSE 221L','Lab Instructor','Lab 2','02:00 PM','04:00 PM']],
  Wednesday:[['Data Structures','CSE 211','Dr. Ahmed','204','11:00 AM','12:30 PM'],['Software Requirements Engineering','SWE 212','Dr. Rahman','401','02:00 PM','03:30 PM']],
  Thursday:[['Web Engineering Lab','SWE 315L','Ms. Sultana','Lab 4','10:00 AM','12:00 PM'],['Software Testing','SWE 321','Dr. Karim','403','01:00 PM','02:30 PM']],
  Friday:[],Saturday:[['Project & Professional Practice','SWE 411','Dr. Islam','405','10:00 AM','12:00 PM']]
 };
 const today=CC.todayName();document.querySelector('#routineGrid').innerHTML=days.map(d=>`<div class="day-col ${d===today?'today':''}"><div class="day-head">${d}</div>${(classes[d]||[]).map(c=>`<div class="card class-card"><strong>${c[0]}</strong><small>${c[1]} · ${c[2]}</small><small>📍 ${c[3]}</small><small>🕒 ${c[4]} – ${c[5]}</small></div>`).join('')||'<div class="empty card">No classes</div>'}</div>`).join('');
});
