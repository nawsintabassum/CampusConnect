<div class="app-layout">
<aside class="sidebar" id="sidebar">
  <div class="nav-label">Workspace</div>
  <a class="nav-link" data-page="dashboard" href="dashboard.html"><span class="ico">⌂</span>Dashboard</a>
  <a class="nav-link" data-page="notices" href="notices.html"><span class="ico">📢</span>Notice Board</a>
  <a class="nav-link" data-page="routine" href="routine.html"><span class="ico">🗓</span>Class Routine</a>
  <a class="nav-link" data-page="assignments" href="assignments.html"><span class="ico">✓</span>Assignments</a>
  <a class="nav-link" data-page="events" href="events.html"><span class="ico">🎟</span>Events</a>

<main class="main"><div class="container">
<div class="page-head"><div><h1>Student Profile</h1><p>Manage the information shown across your student portal.</p></div></div>

</div></main></div>
<div class="toast-container"></div><script src="js/app.js"></script><script src='js/profile.js'></script></body></html>
