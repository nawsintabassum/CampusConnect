<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · CampusConnect</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body><div class="login-page"><div class="card login-card"><div class="login-head"><a class="brand" style="justify-content:center" href="index.html"><span class="logo">CC</span><span>CampusConnect</span></a><h1>Welcome back</h1><p class="muted">Sign in to your student workspace.</p></div>
<div id="loginError" class="badge badge-red hidden" style="width:100%;justify-content:center;margin-bottom:14px"></div>
<form id="loginForm"><div class="form-group"><label>Email or Student ID</label><input class="input" id="identity" placeholder="student@campusconnect.edu" autocomplete="username"></div><div class="form-group"><label>Password</label><input class="input" type="password" id="password" placeholder="Enter any 4+ character demo password" autocomplete="current-password"></div><div class="check-row"><label><input type="checkbox" id="remember"> Remember me</label><label><input type="checkbox" id="showPassword"> Show password</label></div><button class="btn btn-primary" style="width:100%">Login</button></form>
<p class="footer-mini">Demo authentication only. No real credentials are transmitted or stored.</p><a class="btn btn-secondary" style="width:100%;margin-top:10px" href="index.html">← Back to landing</a></div></div><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
